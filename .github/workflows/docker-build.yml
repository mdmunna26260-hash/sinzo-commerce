name: Build & Push Docker image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mdmunna26260-hash/sinzo-commerce:latest
          build-args: |
            DATABASE_URL=postgresql://neondb_owner:npg_7AeZkgBX6xjb@ep-gentle-boat-azlgwrh8-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
